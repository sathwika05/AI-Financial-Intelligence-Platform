services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: findb
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: finpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      # Both URLs are overridden here so .env can hold the host-facing form
      # (localhost:5433) and stay usable from a developer's terminal. The
      # container reaches Postgres by service name instead.
      #
      # Without the second line .env had to carry the container's hostname
      # for the sync URL, which meant `pytest` on the host failed at import:
      # sql_executor opens a SQLDatabase connection at module scope, and
      # "postgres" does not resolve outside this network.
      DATABASE_URL: postgresql+asyncpg://finuser:finpass@postgres:5432/findb
      SYNC_DATABASE_URL: postgresql+psycopg2://finuser:finpass@postgres:5432/findb
    volumes:
      - .:/code
      # Give the container its own virtualenv.
      #
      # The bind mount above makes the project directory the same directory
      # on both sides, and .venv lives inside it — so host and container were
      # sharing one virtualenv. They cannot: a virtualenv pins an absolute
      # interpreter path and holds platform-compiled packages, so whichever
      # side built it last broke the other. Running `uv` on the host left the
      # container reinstalling every package on its next start, and left the
      # host's own scripts pointing at /code, which exists only in here.
      #
      # This anonymous volume shadows .venv inside the container, so the
      # image's Linux virtualenv is used there and the host keeps its own.
      - /code/.venv

volumes:
  postgres_data: