services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: findb
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: finpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - .:/coded

volumes:
  postgres_data: