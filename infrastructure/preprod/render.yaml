# Render blueprint for the public demo API.
#
# Deployed from the repo root: Render reads this file, so `rootDir` and the
# Dockerfile path below are relative to the repository, not to this folder.
#
# Both halves live here: the API as a Docker web service, and the UI as a
# static site. vercel.json is kept as an alternative host, not the live
# one -- either works, and both proxy /api the same way.
#
# The UI is NOT served by the API container, even though main.py can do it
# (it mounts frontend/dist when one exists). frontend/dist is gitignored,
# so it never reaches the image -- and building it in there would be the
# wrong trade anyway: the free API instance sleeps, so a visitor would get
# a blank page for the whole ~50s cold start before anything painted. A
# static site never sleeps, so the page is instant and only the query
# waits.
#
# The database is Neon rather than a Render Postgres: Neon's free tier
# supports pgvector and does not sleep the way a free Render database does.

services:
  - type: web
    name: fip-preprod-api
    runtime: docker

    # Paid, at $7/month, for two reasons that compound.
    #
    # Spin-down: only Free web services sleep (15 minutes without inbound
    # traffic), so a visitor to a demo nobody has touched today waited ~50s
    # for a cold start before the query itself even began. A paid instance
    # never sleeps, and needs no keep-alive cron to fake it.
    #
    # CPU: free is 0.1 CPU, which is why importing backend.main took about
    # two and a half minutes on every deploy. This is 0.5 -- five times the
    # CPU for the same 512MB of RAM.
    #
    # RAM is unchanged at 512MB. backend.main imported at 379MB measured
    # here, which is what OOM-restarted this instance: ~130MB of headroom,
    # against a query that runs six graph stages. Both halves of that
    # sentence have since changed: the query is roughly 10-45s now that
    # the retry storms are fixed, and there is a cap on how many run at
    # once -- SECURITY_MAX_CONCURRENT_QUERIES, default 2, which refuses
    # the third caller with a 429 rather than letting three pipelines
    # share 512MB. Redis is present after all (set in the dashboard, see
    # REDIS_URL below), so the per-IP rate limiter is live too; the
    # concurrency bound is process-local and separate from it.
    #
    # Most of that baseline was torch and transformers, imported on every
    # start and unreachable in this mode. backend/_transformers_guard.py
    # explains the chain and stops it; locally that moved backend.main from
    # 404.5MB to 235.3MB. Re-measure here after the next deploy rather than
    # trusting an arithmetic guess at the container figure.
    #
    # Turning the cross-encoder on would load torch for real and need
    # 1c-2g instead.
    plan: 0.5c-512mb
    region: oregon

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # A query runs intent -> planner -> retrieval -> scoring -> analysis ->
    # reviewer and takes roughly 10-45 seconds. That rules out any serverless
    # host with a short timeout, which is why the API is here and not a
    # Vercel function.
    healthCheckPath: /health

    envVars:
      # portfolio mode must not mount the evaluation or indexing routers.
      # This deployment is public and unauthenticated, so those routes have
      # to be absent rather than merely unlinked from the UI.
      - key: DEPLOYMENT_MODE
        value: portfolio

      - key: APP_ENV
        value: preprod

      # Neon connection strings. Set in the Render dashboard, not here —
      # this file is committed.
      #
      # Neon requires TLS: append ?sslmode=require to the sync URL, and
      # ?ssl=require to the asyncpg one.
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false

      # Groq serves the chat models for the public demo: its free tier
      # removes the cost risk of an unauthenticated endpoint, making the
      # limit requests per minute rather than money. Its API key is NOT an
      # env var -- no code reads one. Provider keys live encrypted in the
      # llm_providers table and arrive with the rows imported in step 4,
      # decrypted with LLM_KEY_ENCRYPTION_SECRET.

      # Still needed, and only for embeddings — Groq has no embeddings API.
      #
      # The snapshot carries document_chunks.embedding, so the corpus side
      # costs nothing: indexing_service.aembed_documents never runs here.
      # What remains is the query side, which cannot be precomputed — the
      # visitor's question is embedded per request and compared against
      # those stored vectors (vector_search.py, `dc.embedding <=> :query_vector`).
      #
      # text-embedding-3-small is $0.02/1M tokens, so a question costs
      # about $0.0000004 — under a cent per 10,000. Set a hard spend limit
      # on the key regardless.
      - key: OPENAI_API_KEY
        sync: false

      - key: LLM_KEY_ENCRYPTION_SECRET
        sync: false

      # REDIS_URL is deliberately NOT declared here.
      #
      # It was, as `sync: false`, and the value set in the dashboard never
      # reached the container: a restarted process with a fresh instance id
      # still logged "connecting to localhost:6379", which in this codebase
      # can only come from DEFAULT_REDIS_URL -- so it started with the
      # variable empty while the dashboard showed a full rediss:// URL.
      #
      # The other sync: false entries above work, and the difference is
      # that they were filled in at blueprint creation rather than added
      # afterwards. Declaring a key here and populating it later is the
      # combination that failed, so this one is dashboard-only: nothing
      # in the file to reconcile it against.
      #
      # config.py defaults it, so an absent variable degrades to uncached
      # market lookups and a rate limiter that fails open -- see the note
      # under SECURITY_RATE_LIMIT below.

      # Per-IP request cap -- enforced ONLY when REDIS_URL points at a
      # reachable Redis.
      #
      # There is no in-process limiter. backend/security/rate_limit.py is
      # Redis-backed and fails open by design (a cache outage must not
      # become an outage), so with no Redis these two values do nothing
      # and the public unauthenticated endpoint is uncapped. Groq's free
      # tier bounds the cost of that; the exposure is quota and abuse.
      #
      # These are the names backend/config.py actually reads. An earlier
      # revision set RATE_LIMIT_PER_HOUR, which no code has ever looked at
      # -- so the public endpoint would have run at the default of 20 per
      # 60 seconds, or 1200 an hour, on an unauthenticated route that costs
      # real provider spend per call.
      - key: SECURITY_RATE_LIMIT
        value: "5"
      - key: SECURITY_RATE_WINDOW_SECONDS
        value: "300"

  # The UI. Free, no cold start, and never sleeps -- unlike the API above.
  - type: web
    name: fip-preprod-web
    runtime: static

    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      # /api is proxied, not called cross-origin: main.py mounts no CORS
      # middleware, so a browser calling the API's hostname directly is
      # blocked before the request leaves. Rewriting keeps the browser
      # same-origin and the API unchanged.
      #
      # Must precede the SPA fallback: Render applies rules in order, so
      # the /* rule below would otherwise answer /api/... with index.html.
      - type: rewrite
        source: /api/*
        destination: https://fip-preprod-api.onrender.com/api/*

      # /health is NOT under /api, and the frontend calls it by that bare
      # path (auth/api.ts) to decide whether to show a sign-in screen. Left
      # to the fallback below it returned index.html, response.json() threw,
      # and the catch did what it is designed to do -- default to requiring
      # auth. The public demo, which has no accounts, showed a login page
      # nobody could get past, and the API looked healthy throughout.
      - type: rewrite
        source: /health
        destination: https://fip-preprod-api.onrender.com/health

      # Client-side routing: every other path is the app itself.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# Notes for standing this up:
#
# 1. Create the Neon project, enable pgvector:
#        CREATE EXTENSION IF NOT EXISTS vector;
#
# 2. Build the schema. NOT `alembic upgrade head` -- the base revision
#    (d8298897af79) does `op.add_column('documents', ...)`, and on an empty
#    database there is no documents table to alter. The chain is only valid
#    against a schema create_all already built; backend/startup_migration
#    explains why. On a fresh database, stamp and let the models build it:
#
#        export DATABASE_URL=<neon-asyncpg> SYNC_DATABASE_URL=<neon-sync>
#        uv run python -m backend.startup_migration   # stamps head
#        uv run uvicorn backend.main:app --port 8001  # lifespan create_all
#
#    Stop the server once it logs "Database tables checked/created". The
#    container's CMD does exactly this pair on every deploy; doing it here
#    first is what lets steps 3 and 4 load data before anything is public.
#
# 3. Load data from the frozen snapshot rather than reseeding — no API
#    quota is consumed and the demo matches what has been benchmarked:
#        DATABASE_URL=<neon> uv run python -m seeds.snapshot restore
#
# 4. Register Groq as the default provider through the admin API against a
#    local run, then export and import those rows; the public deployment
#    has no admin routes to create them with.
#
#    Register three models against it: small openai/gpt-oss-20b, medium
#    and large openai/gpt-oss-120b. Nothing validates a model_name on the
#    way in, so a typo is only found on the first question asked.
#
# The API runs on a paid instance, so it does not sleep and the first
# request of the day costs no more than any other. The UI is a static
# site, which never slept in the first place.
