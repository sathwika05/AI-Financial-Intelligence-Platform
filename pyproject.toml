[project]
name = "financial-intelligence-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    # Required by the ragas DataCompyScore metric used for SQL accuracy.
    # Capped below 1.0: ragas imports datacompy.core.Compare, which 1.x
    # replaced with PandasCompare.
    "datacompy>=0.17.2,<1.0",
    "datasets>=5.0.0",
    "fastapi>=0.136.1",
    "greenlet>=3.5.0",
    "langchain>=1.3.1",
    "langchain-community<0.4.0",
    "langchain-core>=1.4.0",
    "langchain-openai<1.0.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.1",
    # Capped by datacompy, as with pandas. No project code imports numpy
    # directly.
    "numpy>=2.0,<=2.4.3",
    # Capped below 3.0 by datacompy, which the ragas SQL accuracy metric
    # needs. No project code imports pandas directly.
    "pandas>=2.2,<3",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3,<0.5",
    "rank-bm25>=0.2.2",
    "redis>=7.4.0",
    "requests>=2.34.2",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "uvicorn>=0.47.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root, so `backend` and `seeds` import the same way in tests
# as they do when the app or the seed script runs.
pythonpath = ["."]
# Lets an async test be declared with plain @pytest.mark.asyncio and no
# per-module event-loop plumbing.
asyncio_mode = "auto"
# One event loop for the whole session. backend.services.postgres_service
# builds its engine at import time and pools connections on it, so a
# loop-per-test would leave each test's pooled connections bound to a loop
# that is already closed by the time they are released.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


